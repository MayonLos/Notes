<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" width="460" height="250" font-size="11"><style>:root{--ink:#222;--dim:#8a8a8a;--acc:#1f6feb}@media (prefers-color-scheme:dark){:root{--ink:#dcdcdc;--dim:#7d7d7d;--acc:#6aa8ff}}line,path{stroke:var(--ink);stroke-width:1.4;fill:none}text{fill:var(--ink);stroke:none;font-family:sans-serif}.ax{stroke:var(--dim);stroke-width:1}.dimt{fill:var(--dim)}.acc{stroke:var(--acc)}.acct{fill:var(--acc)}.pole{stroke:var(--ink);stroke-width:1.6}</style><line class="ax" x1="30" y1="125" x2="290" y2="125"/><line class="ax" x1="150" y1="20" x2="150" y2="220"/><text x="292" y="129" class="dimt">σ</text><text x="155" y="18" class="dimt">jω</text><text x="92" y="33" class="dimt" font-size="10">左半平面：收敛</text><text x="158" y="33" class="dimt" font-size="10">右半平面：发散</text><path class="ax" d="M 150,20 L 150,220" stroke-width="2" stroke-opacity="0.5"/><line class="pole" x1="76" y1="66" x2="84" y2="74"/><line class="pole" x1="76" y1="74" x2="84" y2="66"/><text x="87" y="62" font-size="10">ζ小：振荡强</text><line class="pole" x1="76" y1="176" x2="84" y2="184"/><line class="pole" x1="76" y1="184" x2="84" y2="176"/><text x="87" y="184" font-size="10"></text><line class="ax" x1="150" y1="125" x2="80" y2="70" stroke-dasharray="3 2"/><text x="108" y="107" class="dimt" font-size="10">ωₙ</text><path class="ax" d="M 124,125 A 26,26 0 0,0 129.6,109" stroke-dasharray="2 2"/><text x="120" y="99" class="dimt" font-size="10">θ</text><text x="10" y="221" font-size="10">cosθ = ζ　　等 ζ 线 = 过原点的射线</text><text x="10" y="237" font-size="10">等 ωₙ 线 = 以原点为心的圆弧</text><line class="pole" x1="28" y1="121" x2="36" y2="129"/><line class="pole" x1="28" y1="129" x2="36" y2="121"/><text x="39" y="117" font-size="10">过阻尼</text><line class="pole" x1="146" y1="33" x2="154" y2="41"/><line class="pole" x1="146" y1="41" x2="154" y2="33"/><text x="157" y="31" font-size="10">虚轴：等幅</text><line class="pole" x1="208" y1="81" x2="216" y2="89"/><line class="pole" x1="208" y1="89" x2="216" y2="81"/><text x="219" y="79" font-size="10">不稳定</text><text x="315" y="46" font-size="11">极点越靠左</text><text x="315" y="62" class="dimt" font-size="10">→ 衰减越快</text><text x="315" y="88" font-size="11">极点越靠近虚轴</text><text x="315" y="104" class="dimt" font-size="10">→ 振荡越明显</text><text x="315" y="130" font-size="11">θ 越大（ζ 越小）</text><text x="315" y="146" class="dimt" font-size="10">→ 超调越大</text><text x="315" y="172" font-size="11">越过虚轴</text><text x="315" y="188" class="dimt" font-size="10">→ 系统不稳定</text></svg>