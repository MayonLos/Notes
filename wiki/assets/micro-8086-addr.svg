<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 262" width="420" height="262" font-size="12"><style>:root{--ink:#222;--dim:#8a8a8a;--fill:#f4f4f4}@media (prefers-color-scheme:dark){:root{--ink:#dcdcdc;--dim:#7d7d7d;--fill:#2a2a2a}}rect{fill:var(--fill);stroke:var(--ink);stroke-width:1.2}line,path{stroke:var(--ink);stroke-width:1.2;fill:none}text{fill:var(--ink);stroke:none;font-family:sans-serif}.dim{stroke:var(--dim)}.dimt{fill:var(--dim)}.mono{font-family:ui-monospace,Consolas,monospace}</style><rect x="30" y="40" width="150" height="26" rx="3"/><text x="105.0" y="57.0" text-anchor="middle" class="mono">1 2 3 4 H</text><text x="105.0" y="34" text-anchor="middle" class="dimt" font-size="11">段寄存器 CS/DS/SS/ES（16 位）</text><path d="M 105,66 L 105,86" marker-end="url(#a)"/><text x="115" y="82" class="dimt" font-size="11">左移 4 位（×16）</text><rect x="30" y="90" width="188" height="26" rx="3"/><text x="124.0" y="107.0" text-anchor="middle" class="mono">1 2 3 4 0 H</text><text x="124.0" y="84" text-anchor="middle" class="dimt" font-size="11">段基址（20 位）</text><rect x="30" y="140" width="150" height="26" rx="3"/><text x="105.0" y="157.0" text-anchor="middle" class="mono">0 0 5 6 H</text><text x="105.0" y="134" text-anchor="middle" class="dimt" font-size="11">偏移量 IP/SI/DI/BX…（16 位）</text><text x="200" y="158" font-size="14">+</text><line class="dim" x1="30" y1="180" x2="330" y2="180"/><rect x="30" y="190" width="188" height="28" rx="3"/><text x="124.0" y="208.0" text-anchor="middle" class="mono">1 2 3 9 6 H</text><text x="124.0" y="184" text-anchor="middle" class="dimt" font-size="11">物理地址（20 位）</text><text x="240" y="209" class="dimt" font-size="11">→ 1 MB 寻址空间</text><text x="30" y="248" font-size="12">物理地址 = 段寄存器 × 16 + 偏移量 = 段基址左移 4 位后相加</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="var(--ink)" stroke="none"/></marker></defs></svg>