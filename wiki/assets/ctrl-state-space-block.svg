<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" width="560" height="290" font-size="12"><style>:root{--ink:#222;--dim:#8a8a8a;--fill:#f4f4f4;--acc:#1f6feb}@media (prefers-color-scheme:dark){:root{--ink:#dcdcdc;--dim:#7d7d7d;--fill:#2a2a2a;--acc:#6aa8ff}}rect{fill:var(--fill);stroke:var(--ink);stroke-width:1.3}line,path{stroke:var(--ink);stroke-width:1.3;fill:none}circle.sum{fill:var(--fill);stroke:var(--ink);stroke-width:1.3}text{fill:var(--ink);stroke:none;font-family:sans-serif}.dimt{fill:var(--dim)}.acc{stroke:var(--acc)}.acct{fill:var(--acc)}.fb{stroke:var(--dim);stroke-width:1.2;stroke-dasharray:4 3}</style><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="var(--ink)" stroke="none"/></marker><marker id="ad" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="var(--dim)" stroke="none"/></marker></defs><text x="14" y="125" font-size="13">u</text><line x1="26" y1="120" x2="62" y2="120" marker-end="url(#a)"/><rect x="62" y="100" width="44" height="40" rx="3"/><text x="84.0" y="125.0" text-anchor="middle" font-size="13">B</text><line x1="106" y1="120" x2="140" y2="120" marker-end="url(#a)"/><circle class="sum" cx="152" cy="120" r="11"/><text x="146" y="114" text-anchor="middle" font-size="11">+</text><text x="146" y="134" text-anchor="middle" font-size="11">+</text><line x1="164" y1="120" x2="200" y2="120" marker-end="url(#a)"/><text x="176" y="112" class="dimt" font-size="12">ẋ</text><rect x="200" y="100" width="58" height="40" rx="3"/><text x="229.0" y="125.0" text-anchor="middle" font-size="18">∫</text><text x="229" y="154" text-anchor="middle" class="dimt" font-size="10">积分器</text><line x1="258" y1="120" x2="320" y2="120" marker-end="url(#a)"/><text x="286" y="112" class="acct" font-size="13">x</text><circle cx="292" cy="120" r="3" fill="var(--ink)" stroke="none"/><rect x="320" y="100" width="44" height="40" rx="3"/><text x="342.0" y="125.0" text-anchor="middle" font-size="13">C</text><line x1="364" y1="120" x2="400" y2="120" marker-end="url(#a)"/><circle class="sum" cx="412" cy="120" r="11"/><text x="406" y="114" text-anchor="middle" font-size="11">+</text><text x="406" y="134" text-anchor="middle" font-size="11">+</text><line x1="424" y1="120" x2="470" y2="120" marker-end="url(#a)"/><text x="478" y="125" font-size="13">y</text><path class="fb" d="M 292,120 L 292,205 L 240,205"/><rect x="180" y="187" width="56" height="36" rx="3"/><text x="208.0" y="210.0" text-anchor="middle" font-size="13">A</text><path class="fb" d="M 180,205 L 152,205 L 152,133" marker-end="url(#ad)"/><text x="248" y="199" class="dimt" font-size="10">状态反馈回自身</text><path class="fb" d="M 44,120 L 44,48 L 372,48"/><rect x="372" y="31" width="44" height="34" rx="3"/><text x="394.0" y="53.0" text-anchor="middle" font-size="13">D</text><path class="fb" d="M 416,48 L 412,48 L 412,107" marker-end="url(#ad)"/><text x="120" y="40" class="dimt" font-size="10">直通项（多数物理系统 D=0）</text><circle cx="44" cy="120" r="3" fill="var(--ink)" stroke="none"/><text x="14" y="262" font-size="13">ẋ = A x + B u</text><text x="14" y="280" font-size="13">y = C x + D u</text><text x="180" y="262" class="dimt" font-size="11">A：状态怎么自己演化　B：输入怎么进来</text><text x="180" y="280" class="dimt" font-size="11">C：从状态怎么取出输出　D：输入直达输出</text><text x="300" y="78" class="acct" font-size="11">积分器的输出就是状态</text></svg>